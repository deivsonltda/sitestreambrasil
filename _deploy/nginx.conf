user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;

  access_log  /var/log/nginx/access.log;

  client_max_body_size 25m;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  upstream php_fpm {
    server 127.0.0.1:9000;
  }

  # Bloqueia arquivos/pastas sensíveis
  map $uri $block_sensitive {
    default 0;
    ~*^/\. 1;
    ~*^/config\.php$ 1;
    ~*^/Dockerfile$ 1;
    ~*^/_deploy/ 1;
    ~*^/src/ 1;
  }

  # -----------------------------
  # MAIN DOMAIN (landing /public)
  # -----------------------------
  server {
    listen 80;
    server_name streambrasil.online www.streambrasil.online;

    root /var/www/app/public;
    index index.php index.html;

    if ($block_sensitive) { return 404; }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;
      fastcgi_pass php_fpm;
    }
  }

  # -----------------------------
  # ADMIN (public/admin)
  # -----------------------------
  server {
    listen 80;
    server_name admin.streambrasil.online;

    root /var/www/app/public/admin;
    index index.php;

    if ($block_sensitive) { return 404; }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;
      fastcgi_pass php_fpm;
    }
  }

  # -----------------------------
  # AFILIADO (public/affiliate)
  # -----------------------------
  server {
    listen 80;
    server_name afiliado.streambrasil.online;

    root /var/www/app/public/affiliate;
    index index.php;

    if ($block_sensitive) { return 404; }

    # Compatibilidade: links antigos /affiliate/...
    location ^~ /affiliate/ {
      return 301 /$request_uri;
      # Obs: essa linha acima não funciona do jeito esperado pois $request_uri inclui /affiliate/.
      # Use rewrite:
      # rewrite ^/affiliate/(.*)$ /$1 permanent;
    }

    # Versão correta:
    location ^~ /affiliate/ {
      rewrite ^/affiliate/(.*)$ /$1 permanent;
    }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;
      fastcgi_pass php_fpm;
    }
  }

  # -----------------------------
  # CRM (public/crm/public)
  # -----------------------------
  server {
    listen 80;
    server_name crm.streambrasil.online;

    root /var/www/app/public/crm/public;
    index index.php;

    if ($block_sensitive) { return 404; }

    # Compatibilidade: links antigos /crm/...
    location ^~ /crm/ {
      rewrite ^/crm/(.*)$ /$1 permanent;
    }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;
      fastcgi_pass php_fpm;
    }
  }

  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }
}