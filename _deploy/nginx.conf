user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  access_log /var/log/nginx/access.log;
  client_max_body_size 25m;

  upstream php_fpm { server 127.0.0.1:9000; }

  map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https on;
  }

  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 80;
    server_name streambrasil.online www.streambrasil.online;

    root /var/www/app/public;
    index index.php index.html;

    add_header X-VHost "main" always;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param HTTPS $fastcgi_https;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;
      fastcgi_pass php_fpm;
    }
  }

  server {
    listen 80;
    server_name admin.streambrasil.online;

