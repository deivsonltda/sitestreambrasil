user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  access_log /var/log/nginx/access.log;
  client_max_body_size 25m;

  # Headers básicos
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # PHP-FPM
  upstream php_fpm {
    server 127.0.0.1:9000;
  }

  # Bloquear acesso a coisas sensíveis
  map $uri $block_sensitive {
    default 0;
    ~*^/\. 1;
    ~*^/config\.php$ 1;
    ~*^/Dockerfile$ 1;
    ~*^/_deploy/ 1;
    ~*^/src/ 1;
  }

  # Se vier https pelo Cloudflare/EasyPanel, repassa para o PHP
  map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https on;
  }

  # =========================
  # FALLBACK (host errado)
  # =========================
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  # =========================
  # MAIN: streambrasil.online
  # =========================
  server {
    listen 80;
    server_name streambrasil.online www.streambrasil.online;

    root /var/www/app/public;
    index index.php index.html;

    add_header X-VHost "main" always;

    if ($block_sensitive) { return 404; }

    # Se acessarem caminhos antigos no domínio principal, manda pro subdomínio
    location ^~ /admin/     { return 301 https://admin.streambrasil.online$request_uri; }
    location ^~ /affiliate/ { return 301 https://afiliado.streambrasil.online$request_uri; }
    location ^~ /crm/       { return 301 https://crm.streambrasil.online$request_uri; }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param HTTPS $fastcgi_https;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;
      fastcgi_pass php_fpm;
    }
  }

  # =========================
  # ADMIN: admin.streambrasil.online
  # =========================
  server {
    listen 80;
    server_name admin.streambrasil.online;

    root /var/www/app/public/admin;
    index index.php;

    add_header X-VHost "admin" always;

    if ($block_sensitive) { return 404; }

    # Se algum link vier /admin/arquivo.php dentro do subdomínio, normaliza
    location ^~ /admin/ {
      rewrite ^/admin/(.*)$ /$1 permanent;
    }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param HTTPS $fastcgi_https;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;
      fastcgi_pass php_fpm;
    }
  }

  # =========================
  # AFILIADO: afiliado.streambrasil.online
  # =========================
  server {
    listen 80;
    server_name afiliado.streambrasil.online;

    root /var/www/app/public/affiliate;
    index index.php;

    add_header X-VHost "afiliado" always;

    if ($block_sensitive) { return 404; }

    # Compat: se algum código antigo mandar /affiliate/xxx aqui, remove o prefixo
    location ^~ /affiliate/ {
      rewrite ^/affiliate/(.*)$ /$1 permanent;
    }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param HTTPS $fastcgi_https;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;
      fastcgi_pass php_fpm;
    }
  }

  # =========================
  # CRM: crm.streambrasil.online
  # =========================
  server {
    listen 80;
    server_name crm.streambrasil.online;

    root /var/www/app/public/crm/public;
    index index.php;

    add_header X-VHost "crm" always;

    if ($block_sensitive) { return 404; }

    location ^~ /crm/ {
      rewrite ^/crm/(.*)$ /$1 permanent;
    }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param HTTPS $fastcgi_https;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;
      fastcgi_pass php_fpm;
    }
  }
}