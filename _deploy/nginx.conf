user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 2048;

  access_log  /var/log/nginx/access.log;

  client_max_body_size 25m;

  # Security headers (básico)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # PHP-FPM
  upstream php_fpm {
    server 127.0.0.1:9000;
  }

  # Diz pro PHP quando o request original era HTTPS (Cloudflare/EasyPanel)
  map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https on;
  }

  # Bloqueia arquivos/pastas sensíveis (independente do server)
  map $uri $block_sensitive {
    default 0;
    ~*^/\. 1;
    ~*^/config\.php$ 1;
    ~*^/Dockerfile$ 1;
    ~*^/_deploy/ 1;
    ~*^/src/ 1;
    ~*^/vendor/ 1;
  }

  # Cache de estáticos (helper)
  map $uri $is_static {
    default 0;
    ~*\.(
      css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|
      woff|woff2|ttf|eot|otf|
      mp3|mp4|webm|json|map
    )$ 1;
  }

  # =============================
  # MAIN DOMAIN (landing /public)
  # =============================
  server {
    listen 80;
    server_name streambrasil.online www.streambrasil.online;

    root /var/www/app/public;
    index index.php index.html;

    if ($block_sensitive) { return 404; }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|otf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;

      fastcgi_param HTTPS $fastcgi_https;
      fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
      fastcgi_param HTTP_X_FORWARDED_HOST  $host;

      fastcgi_pass php_fpm;
    }
  }

  # =============================
  # ADMIN (public/admin) -> raiz /
  # =============================
  server {
    listen 80;
    server_name admin.streambrasil.online;

    root /var/www/app/public/admin;
    index index.php;

    if ($block_sensitive) { return 404; }

    # Se alguém tentar /admin/... aqui, joga pra raiz (remove /admin)
    location ^~ /admin/ {
      return 301 /$is_args$args;
    }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|otf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;

      fastcgi_param HTTPS $fastcgi_https;
      fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
      fastcgi_param HTTP_X_FORWARDED_HOST  $host;

      fastcgi_pass php_fpm;
    }
  }

  # =================================
  # AFILIADO (public/affiliate) -> /
  # =================================
  server {
    listen 80;
    server_name afiliado.streambrasil.online;

    root /var/www/app/public/affiliate;
    index index.php;

    if ($block_sensitive) { return 404; }

    # Se alguém tentar /affiliate/... aqui, remove /affiliate
    location ^~ /affiliate/ {
      return 301 /$is_args$args;
    }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|otf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;

      fastcgi_param HTTPS $fastcgi_https;
      fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
      fastcgi_param HTTP_X_FORWARDED_HOST  $host;

      fastcgi_pass php_fpm;
    }
  }

  # =============================
  # CRM (public/crm/public) -> /
  # =============================
  server {
    listen 80;
    server_name crm.streambrasil.online;

    root /var/www/app/public/crm/public;
    index index.php;

    if ($block_sensitive) { return 404; }

    # Se alguém tentar /crm/... aqui, remove /crm
    location ^~ /crm/ {
      return 301 /$is_args$args;
    }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|otf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;

      fastcgi_param HTTPS $fastcgi_https;
      fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
      fastcgi_param HTTP_X_FORWARDED_HOST  $host;

      fastcgi_pass php_fpm;
    }
  }

  # Fallback
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }
}