user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 2048;

  access_log  /var/log/nginx/access.log;

  client_max_body_size 25m;

  # Security headers (básico)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Se estiver atrás do Cloudflare / proxy, ajuda a resolver HTTPS/cookies (sem loop)
  map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https   on;
  }

  # PHP-FPM (no MESMO container)
  upstream php_fpm {
    server 127.0.0.1:9000;
    keepalive 16;
  }

  # Bloquear arquivos sensíveis (por URI)
  map $uri $block_sensitive {
    default 0;
    ~*^/\. 1;
    ~*^/config\.php$ 1;
    ~*^/Dockerfile$ 1;
    ~*^/_deploy/ 1;
    ~*^/src/ 1;
    ~*^/vendor/ 1;
    ~*^/composer\.(json|lock)$ 1;
  }

  # Helper comum p/ estáticos
  map $uri $is_static {
    default 0;
    ~*\.((css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|map))$ 1;
  }

  # -----------------------------
  # MAIN DOMAIN (landing /public)
  # -----------------------------
  server {
    listen 80;
    server_name streambrasil.online www.streambrasil.online;

    root  /var/www/app/public;
    index index.php index.html;

    if ($block_sensitive) { return 404; }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param HTTPS $fastcgi_https;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT  $document_root;
      fastcgi_pass php_fpm;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|map)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }
  }

  # -----------------------------
  # ADMIN (public/admin)
  # -----------------------------
  server {
    listen 80;
    server_name admin.streambrasil.online;

    root  /var/www/app/public/admin;
    index index.php;

    if ($block_sensitive) { return 404; }

    # Se algum código apontar /admin/xxx dentro do subdomínio admin.*, remove o prefixo
    location ^~ /admin/ {
      rewrite ^/admin/(.*)$ /$1 last;
    }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param HTTPS $fastcgi_https;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT  $document_root;
      fastcgi_pass php_fpm;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|map)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }
  }

  # -----------------------------
  # AFILIADO (public/affiliate)
  # -----------------------------
  server {
    listen 80;
    server_name afiliado.streambrasil.online;

    root  /var/www/app/public/affiliate;
    index index.php;

    if ($block_sensitive) { return 404; }

    # 🔥 CORREÇÃO DO SEU PROBLEMA:
    # Seu PHP ainda redireciona pra /affiliate/login.php e /affiliate/dashboard.php.
    # No subdomínio afiliado.*, isso vira caminho errado e pode causar loop.
    # Então a gente remove automaticamente o prefixo /affiliate/.
    location ^~ /affiliate/ {
      rewrite ^/affiliate/(.*)$ /$1 last;
    }

    # (opcional) se cair exatamente /affiliate, joga pra /
    location = /affiliate {
      return 301 /;
    }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param HTTPS $fastcgi_https;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT  $document_root;
      fastcgi_pass php_fpm;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|map)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }
  }

  # -----------------------------
  # CRM (public/crm/public)
  # -----------------------------
  server {
    listen 80;
    server_name crm.streambrasil.online;

    root  /var/www/app/public/crm/public;
    index index.php;

    if ($block_sensitive) { return 404; }

    # Se algum código apontar /crm/xxx dentro do subdomínio crm.*, remove o prefixo
    location ^~ /crm/ {
      rewrite ^/crm/(.*)$ /$1 last;
    }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param HTTPS $fastcgi_https;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT  $document_root;
      fastcgi_pass php_fpm;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|map)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }
  }

  # Fallback (se alguém bater por IP ou domínio não listado)
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }
}