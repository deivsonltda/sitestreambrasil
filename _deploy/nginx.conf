user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 2048;

  # Logs
  access_log  /var/log/nginx/access.log;

  # Upload limit (ajuste se precisar)
  client_max_body_size 25m;

  # Security headers (básico)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # PHP
  upstream php_fpm {
    server 127.0.0.1:9000;
  }

  # Helper: negar arquivos sensíveis
  map $uri $block_sensitive {
    default 0;
    ~*^/\. 1;
    ~*^/config\.php$ 1;
    ~*^/Dockerfile$ 1;
    ~*^/_deploy/ 1;
    ~*^/src/ 1;
  }

  # -----------------------------
  # MAIN DOMAIN (landing /public)
  # -----------------------------
  server {
    listen 80;
    server_name streambrasil.online www.streambrasil.online;

    root /var/www/app/public;
    index index.php index.html;

    if ($block_sensitive) { return 404; }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;
      fastcgi_pass php_fpm;
    }
  }

  # -----------------------------
  # ADMIN (public/admin)
  # -----------------------------
  server {
    listen 80;
    server_name admin.streambrasil.online;

    root /var/www/app/public/admin;
    index index.php;

    if ($block_sensitive) { return 404; }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;
      fastcgi_pass php_fpm;
    }
  }

  # -----------------------------
  # AFILIADO (public/affiliate)
  # -----------------------------
  server {
    listen 80;
    server_name afiliado.streambrasil.online;

    root /var/www/app/public/affiliate;
    index index.php;

    if ($block_sensitive) { return 404; }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;
      fastcgi_pass php_fpm;
    }
  }

  # -----------------------------
  # CRM (public/crm/public)
  # -----------------------------
  server {
    listen 80;
    server_name crm.streambrasil.online;

    root /var/www/app/public/crm/public;
    index index.php;

    if ($block_sensitive) { return 404; }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;
      fastcgi_pass php_fpm;
    }
  }

  # Fallback (se alguém bater por IP ou domínio não listado)
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }
}